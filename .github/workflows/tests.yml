# Runs the test suite on every push. The tests use fakes for the API and skip the one that
# needs downloaded speech models, so no keys or large downloads are needed.
name: tests
on: [push, pull_request, workflow_dispatch]   # workflow_dispatch adds a Run workflow button
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
