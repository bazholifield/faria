<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faria</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.25rem; min-height: 100vh;
    background: #14120f; color: #e8e2d5;
    font: 16px/1.5 Georgia, 'Times New Roman', serif;
    display: flex; flex-direction: column; align-items: center;
  }
  main { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 1rem; }
  h1 { font-size: 1.3rem; font-weight: normal; letter-spacing: 0.14em; margin: 0; }
  h1 small { opacity: 0.45; letter-spacing: normal; font-size: 0.75rem; margin-left: 0.75rem; }
  #setup, #bar { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
  input, select, button {
    font: inherit; color: inherit; background: #221f1a;
    border: 1px solid #3a352c; border-radius: 6px; padding: 0.45rem 0.7rem;
  }
  button { cursor: pointer; background: #2c2820; }
  button:hover { background: #3a3428; }
  button:disabled { opacity: 0.4; cursor: default; }
  #state { display: flex; align-items: center; gap: 0.55rem; min-height: 2rem; }
  #dot { width: 11px; height: 11px; border-radius: 50%; background: #555; transition: background 0.2s; }
  #dot.listening { background: #7fae6a; box-shadow: 0 0 8px #7fae6a88; }
  #dot.transcribing, #dot.thinking { background: #c9a15a; }
  #dot.speaking { background: #6a93ae; box-shadow: 0 0 8px #6a93ae88; }
  #lang { margin-left: auto; font-size: 0.8rem; opacity: 0.7; border: 1px solid #3a352c;
          padding: 0.15rem 0.6rem; border-radius: 999px; }
  #log { display: flex; flex-direction: column; gap: 0.7rem; }
  .turn { padding: 0.6rem 0.9rem; border-radius: 10px; max-width: 92%; white-space: pre-wrap; }
  .you { align-self: flex-end; background: #2b3324; }
  .faria { align-self: flex-start; background: #221f1a; }
  .faria strong { color: #f0c987; font-weight: normal; border-bottom: 1px solid #f0c98766; }
  .meta { font-size: 0.72rem; opacity: 0.45; align-self: center; }
  #summary { border: 1px solid #3a352c; border-radius: 10px; padding: 0.9rem; display: none; }
  #summary h2 { font-size: 0.95rem; margin: 0 0 0.5rem; opacity: 0.8; }
  #summary ul { margin: 0.4rem 0 0; padding-left: 1.2rem; }
</style>
</head>
<body>
<main>
  <h1>FARIA<small>the tutor is in</small></h1>

  <div id="setup">
    <input id="name" placeholder="name" value="bazh" size="8">
    <select id="language">
      <option value="">companion (English home base)</option>
      <option value="es">Spanish</option><option value="fr">French</option>
      <option value="de">German</option><option value="ar">Arabic</option>
      <option value="eu">Basque</option>
    </select>
    <input id="goal" placeholder="session goal (optional)" size="20">
    <button id="start">Start</button>
  </div>

  <div id="bar" style="display:none">
    <div id="state"><div id="dot"></div><span id="stateLabel">connecting…</span>
      <span id="lang"></span></div>
    <button id="end">End session</button>
  </div>

  <div id="log"></div>
  <div id="summary"></div>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let ws, audioCtx, workletNode, mediaStream;
let playhead = 0, playbackRate = 22050;
let fariaBubble = null, fariaRaw = "";
let playing = [];  // scheduled AudioBufferSourceNodes, so barge-in can stop them
let resampleCarry = null;

function addTurn(cls, text) {
  const div = document.createElement("div");
  div.className = "turn " + cls;
  div.textContent = text;
  $("log").appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
  return div;
}
function addMeta(text) {
  const div = document.createElement("div");
  div.className = "meta"; div.textContent = text;
  $("log").appendChild(div);
}

// ---- mic: Float32 @ ctx rate -> Int16 @ 16k, batched ~90ms per WS frame ----
let sendBuf = [];
let sendBufSamples = 0;
function onMicBlock(block) {
  const inRate = audioCtx.sampleRate, outRate = 16000;
  const ratio = inRate / outRate;
  const outLen = Math.floor(block.length / ratio);
  const out = new Int16Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const pos = i * ratio, i0 = Math.floor(pos), frac = pos - i0;
    const a = block[i0], b = block[Math.min(i0 + 1, block.length - 1)];
    const s = a + (b - a) * frac;
    out[i] = Math.max(-32768, Math.min(32767, Math.round(s * 32767)));
  }
  sendBuf.push(out); sendBufSamples += out.length;
  if (sendBufSamples >= 16000 * 0.09 && ws && ws.readyState === 1) {
    const merged = new Int16Array(sendBufSamples);
    let off = 0;
    for (const chunk of sendBuf) { merged.set(chunk, off); off += chunk.length; }
    ws.send(merged.buffer);
    sendBuf = []; sendBufSamples = 0;
  }
}

// The tutor marks a recast *like this* (ADR-032): bold on screen, stressed in the voice.
function renderReply(el, raw) {
  const esc = raw.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  el.innerHTML = esc.replace(/\*([^*\n]+)\*/g, "<strong>$1</strong>");
}

// Barge-in (ADR-031): the learner started talking, so drop everything still queued.
function stopPlayback() {
  for (const src of playing) { try { src.stop(); } catch (e) {} }
  playing = [];
  playhead = audioCtx ? audioCtx.currentTime : 0;
}

// ---- playback: Int16 @ server rate, scheduled back-to-back ----
function playPcm(arrayBuffer) {
  const int16 = new Int16Array(arrayBuffer);
  if (!int16.length) return;
  const float32 = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768;
  const buf = audioCtx.createBuffer(1, float32.length, playbackRate);
  buf.copyToChannel(float32, 0);
  const src = audioCtx.createBufferSource();
  src.buffer = buf; src.connect(audioCtx.destination);
  playhead = Math.max(playhead, audioCtx.currentTime + 0.05);
  src.start(playhead);
  playhead += buf.duration;
  playing.push(src);
  src.onended = () => { playing = playing.filter((s) => s !== src); };
}

async function start() {
  $("start").disabled = true;
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 },
    });
  } catch (e) {
    $("start").disabled = false;
    alert("Microphone access failed: " + e.message);
    return;
  }
  audioCtx = new AudioContext();
  await audioCtx.audioWorklet.addModule("/static/worklet.js");
  const source = audioCtx.createMediaStreamSource(mediaStream);
  workletNode = new AudioWorkletNode(audioCtx, "mic-capture");
  workletNode.port.onmessage = (e) => onMicBlock(e.data);
  source.connect(workletNode);

  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws/session`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => ws.send(JSON.stringify({
    type: "start",
    name: $("name").value || "learner",
    language: $("language").value || null,
    goal: $("goal").value || null,
  }));
  ws.onmessage = (e) => {
    if (e.data instanceof ArrayBuffer) { playPcm(e.data); return; }
    handle(JSON.parse(e.data));
  };
  ws.onclose = () => { $("stateLabel").textContent = "disconnected"; $("dot").className = ""; };
  $("setup").style.display = "none";
  $("bar").style.display = "flex";
}

function handle(msg) {
  switch (msg.type) {
    case "session_started":
      $("lang").textContent = msg.language + (msg.level ? " · " + msg.level : "");
      addMeta(msg.home ? "companion mode — just talk; ask to switch languages any time"
                       : "focused practice — " + msg.language);
      break;
    case "state":
      $("dot").className = msg.value;
      $("stateLabel").textContent = msg.value;
      break;
    case "you_said":
      addTurn("you", msg.text);
      fariaBubble = null;
      break;
    case "delta":
      if (!fariaBubble) { fariaBubble = addTurn("faria", ""); fariaRaw = ""; }
      fariaRaw += msg.text;
      renderReply(fariaBubble, fariaRaw);
      break;
    case "stop_audio":
      stopPlayback();
      break;
    case "audio_format":
      playbackRate = msg.sample_rate;
      break;
    case "reply_done":
      fariaBubble = null;
      if (msg.switched) { $("lang").textContent = msg.language; addMeta("→ now speaking " + msg.language); }
      if (msg.interrupted) addMeta("(you came in — Faria stopped talking)");
      if (msg.timings && msg.timings.first_audio_s != null)
        addMeta(`voice in ${msg.timings.first_audio_s}s (stt ${msg.timings.stt_s}s${msg.timings.early_stt ? ", early" : ""}` +
                (msg.timings.ack_s != null ? `, “mm” at ${msg.timings.ack_s}s` : "") + ")");
      break;
    case "session_ended": {
      const box = $("summary");
      box.style.display = "block";
      let html = "<h2>Session notes</h2>";
      if (msg.recap && msg.recap.length) {
        html += "<ul>" + msg.recap.map(r =>
          `<li>“${r.said}” → ${r.correction || r.note || ""}</li>`).join("") + "</ul>";
      }
      if (msg.summary) html += `<p>${msg.summary}</p>`;
      if (msg.next_focus && msg.next_focus.length)
        html += "<p><em>Next: " + msg.next_focus.join("; ") + "</em></p>";
      box.innerHTML = html;
      stopAudio();
      break;
    }
    case "error":
      addMeta("error: " + msg.message);
      break;
  }
}

function stopAudio() {
  if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
  if (audioCtx) audioCtx.close();
  $("bar").style.display = "none";
}

$("start").onclick = start;
$("end").onclick = () => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "end_session" })); };
window.addEventListener("beforeunload", () => { if (ws && ws.readyState === 1) ws.close(); });
</script>
</body>
</html>
