# Faria tunables. Code defaults (src/faria/config.py) match this file exactly;
# it exists so you can see and tweak every knob in one place. Point FARIA_CONFIG
# at a different file to keep experimental configs side by side.

[models]
# Tutor brain: Sonnet-class for conversation quality (deliberate choice; see DECISIONS.md ADR-002).
conversation = "claude-sonnet-5"
# Summaries + end-of-session sweep are cheaper, non-interactive work.
summarizer = "claude-haiku-4-5"
max_reply_tokens = 1024
max_summary_tokens = 4096
# "disabled" = lowest latency (right for conversation). "adaptive" = let the model
# think when it wants; better for the annotation sidecar, slower to first token.
thinking = "disabled"

[correction]
# Frequency: off | minimal | balanced | aggressive — per-profile setting overrides this.
default_aggressiveness = "balanced"
# Style: recast | recast_plus_note | explicit (ADR-013; recast = repeat the
# sentence back naturally, no meta-talk).
default_style = "recast"
# Flow-protection budget: hard caps on inline corrections (see domain/correction.py).
max_inline_per_turn = 1
max_inline_per_window = 2
window_turns = 5
# A pattern recurring this many times escalates to inline + focus list.
recurrence_escalation_threshold = 3
# Pattern lifecycle (ADR-018): recurring past this many occurrences flags
# fossilization_risk; a quiet pattern decays active -> improving -> resolved.
fossilization_threshold = 6
pattern_improving_after_days = 14
pattern_resolved_after_days = 45
# Companion mode: minimum learner turns between two TUTOR-initiated language
# pivots (learner-requested switches are never throttled).
min_turns_between_pivots = 4

[memory]
# How many recent session summaries are injected into the next session's prompt.
recent_summaries_in_prompt = 3

[audio]
# The browser client sends 16 kHz mono Int16 PCM; VAD + whisper assume it.
stt_default = "faster-whisper"  # faster-whisper (local) | openai (needs OPENAI_API_KEY, ~$0.003/min)
openai_stt_model = "gpt-4o-mini-transcribe"
tts_default = "piper"           # piper (local, free) | openai (needs OPENAI_API_KEY, one voice for every language)
sample_rate = 16000
# faster-whisper: model size vs. latency is THE knob for the <2s budget.
# Benchmarked here (WSL2 CPU, int8): "base" ~1.5s per 3s utterance, "small"
# 7-9s (busts the budget). Raise to "small"/"medium" only with stt_device
# = "cuda" (WSL2 CUDA passthrough works if the Windows NVIDIA driver is set up).
stt_model = "base"
stt_device = "auto"
stt_compute = "int8"
pronunciation_suspect_threshold = 0.5
# Below this STT confidence a word is treated as possibly mistranscribed:
# flagged to the tutor, never corrected, never pattern-counted (ADR-023).
stt_suspect_threshold = 0.7
# Hallucination filtering (ADR-025): whisper invents words on silence/noise.
stt_vad_filter = true           # faster-whisper's built-in Silero VAD (the big win)
stt_no_speech_max = 0.6         # drop transcript if mean no_speech_prob above this
stt_logprob_min = -1.0          # drop if mean avg_logprob below this
stt_min_confidence = 0.45       # drop if mean word confidence below this
# Speaking pace: >1.0 slower/more deliberate (mentor-ish), <1.0 faster.
piper_length_scale = 1.1
# VAD utterance segmentation. Aggressiveness 3 = fewer false triggers on noise
# (raise vad_silence_ms if it cuts you off; lower aggressiveness if it misses
# quiet speech).
vad_aggressiveness = 3          # 0 lenient .. 3 aggressive
vad_silence_ms = 700            # trailing silence that ends your turn
vad_min_speech_ms = 250
vad_max_utterance_s = 45
voices_dir = "data/voices"      # Piper voices auto-download here on first use
# Early transcription (ADR-030): a pause this long starts recognition on the audio so
# far. If that transcript lands while you're still quiet, a turn ending mid-thought
# ("y…", "and…", "äh") waits endpoint_hold_ms longer, and a finished sentence ends at
# endpoint_early_ratio of the usual wait. 0 turns early transcription off.
endpoint_probe_ms = 300
endpoint_hold_ms = 700
endpoint_early_ratio = 0.6
# Instant acknowledgement (ADR-029): "mm" / "ajá" the moment you stop. Phrases below.
ack_enabled = true
ack_probability = 0.7           # not every turn
ack_min_speech_s = 0.8          # never for a blip
# Barge-in (ADR-031): talking over Faria stops its voice. Best with a headset.
barge_in = true
barge_in_min_ms = 400
# Stressed recasts (ADR-032): *marked* corrected words come after a short pause, slower.
emphasis = true
emphasis_pause_ms = 90
emphasis_slowdown = 1.2
# OpenAI voice (tts_default = "openai")
openai_tts_model = "gpt-4o-mini-tts"
openai_tts_voice = "alloy"

[audio.vad_silence_ms_by_level]
# Patience by level (ADR-030): the silence that ends your turn, longer for beginners.
# Home base uses vad_silence_ms; a language with no estimate yet counts as A2.
A1 = 1100
A2 = 950
B1 = 800
B2 = 700
C1 = 650
C2 = 600

[audio.pace_by_level]
# Faria's speaking pace by level (>1 = slower), times "slower / faster, please".
A1 = 1.25
A2 = 1.15
B1 = 1.05
B2 = 1.0
C1 = 1.0
C2 = 1.0

[audio.ack_phrases]
# Neutral listening sounds only: never agreement ("vale", "right"), since the reply may disagree.
en = ["Mm-hm.", "Mm.", "I see."]
es = ["Ajá.", "Mm.", "Ya veo."]
fr = ["Mm.", "Je vois.", "Mm-hm."]
de = ["Aha.", "Mm.", "Verstehe."]

[audio.piper_voices]
# Piper voice per language. Audition candidates with:
#   faria say --language en --voice en_US-norman-medium --text "..."
# then set your pick here. No Basque (eu) voice exists in the Piper catalog —
# the TTS twin of the Whisper-Basque STT gap; use the openai backend for eu.
en = "en_US-john-medium"
es = "es_ES-sharvard-medium"
fr = "fr_FR-siwis-medium"
de = "de_DE-thorsten-medium"
ar = "ar_JO-kareem-medium"

[course]
# The course layer (ADR-034): ideas for the mentor, never an agenda; you choose length and direction.
enabled = true
curriculum_dir = "curriculum"      # <lang>.yaml syllabus + topic cards (edit in the Helm's Syllabus tab)
max_due_words = 6                  # words offered for review per session
new_items_offered = 2              # syllabus items suggested per session
topics_offered = 2                 # stories offered per session
review_intervals_days = [1, 3, 7, 14, 30]  # Leitner boxes 1..5
solid_after_sessions = 3           # correct use in this many separate sessions = solid

[course.varieties]
# The variety the mentor speaks by default; other regions come up as asides.
es = "neutral Latin American Spanish (Mexico-centred, ustedes for 'you all'); Spain's vosotros and Argentina's vos are taught too, as variants to understand and enjoy"
fr = "standard French of France"
de = "standard German of Germany"

[server]
# 127.0.0.1 for the desk (Windows browser -> WSL2 localhost forwarding);
# switch to 0.0.0.0 for LAN/Tailscale in Phase 3.
host = "127.0.0.1"
port = 8765
