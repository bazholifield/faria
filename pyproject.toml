[project]
name = "faria"
version = "0.1.0"
description = "Personal AI language tutor and conversation partner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.116",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
faria = "faria.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faria"]

[tool.pytest.ini_options]
testpaths = ["tests"]
