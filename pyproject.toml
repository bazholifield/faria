[project]
name = "faria"
version = "0.1.0"
description = "Personal AI language tutor and conversation partner"
readme = "README.md"
license = {text = "PolyForm-Noncommercial-1.0.0"}   # see LICENSE.md: free to use and change, not to sell
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.116",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    # Phase 2: audio + server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
    "webrtcvad>=2.0.10",
    # webrtcvad imports pkg_resources at runtime; setuptools>=81 removed it.
    # Drop this pin if webrtcvad ever gets a release without that import.
    "setuptools<81",
    "numpy>=1.26",
    "httpx>=0.27",
    "lingua-language-detector>=2.0",  # short-text/mixed-language ID for TTS routing (ADR-026)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
faria = "faria.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faria"]

[tool.pytest.ini_options]
testpaths = ["tests"]
