    title: "Luther's Bible and standard German"
    notes: "History, religion, or how standard languages form."
    tidbit: "Martin Luther translated the New Testament in about eleven weeks while hiding in Wartburg Castle in 1521–22. He said you had to look at the mouths of ordinary people to know how to write German."
    facts:
      - "Martin Luther translated the New Testament into German, published in 1522."
      - "His translation was widely read and helped spread a common written German across many dialect regions."
      - "Many German idioms come from Luther's Bible."
