    title: "Falsche Freunde"
    notes: "Whenever the learner trips on one, or for a fun aside."
    tidbit: "German Gift means poison. It comes from the same root as English \"gift\", and once meant something given, possibly by way of a euphemism for a dose."
    facts:
      - "Gift means poison, not a present (a present is ein Geschenk)."
      - "Bekommen means to get or receive, not to become (to become is werden)."
      - "A Handy is a mobile phone."
