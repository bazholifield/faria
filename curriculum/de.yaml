  - id: de.b2.topic-luther
    level: B2
    strand: topic
    title: "Luther's Bible and standard German"
    notes: "History, religion, or how standard languages form."
    facts:
      - "Martin Luther translated the New Testament into German, published in 1522."
      - "His translation was widely read and helped spread a common written German across many dialect regions."
      - "Many German idioms come from Luther's Bible."
    words: [die Übersetzung, die Bibel, die Mundart]
    status: draft
  - id: de.b2.topic-false-friends
    level: B2
    strand: topic
    title: "Falsche Freunde"
    notes: "Whenever the learner trips on one, or for a fun aside."
    facts:
      - "Gift means poison, not a present (a present is ein Geschenk)."
      - "Bekommen means to get or receive, not to become (to become is werden)."
      - "A Handy is a mobile phone."
    words: [das Gift, das Geschenk, bekommen, das Handy]
    status: draft
