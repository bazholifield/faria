  - id: fr.b2.topic-verlan
    level: B2
    strand: topic
    title: "Verlan"
    notes: "Slang, young people's speech, or colloquial French."
    tidbit: "In 1977 the singer Renaud had a hit called \"Laisse béton\", verlan for laisse tomber, \"forget it\". It took the slang of the suburbs to the national airwaves."
    facts:
      - "Verlan is slang that swaps the syllables of words; the name itself is l'envers ('the reverse') reversed."
      - "Common examples: meuf (femme), relou (lourd, annoying), chelou (louche, shady)."
      - "Some verlan words, like meuf, are now ordinary informal French."
    words: [le verlan, la meuf, relou, chelou]
