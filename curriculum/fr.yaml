  - id: fr.b2.topic-14-juillet
    level: B2
    strand: topic
    title: "Le 14 juillet"
    notes: "Holidays, history, or around mid-July."
    facts:
      - "France's national day is 14 July."
      - "It commemorates the storming of the Bastille prison in Paris on 14 July 1789, a symbol of the start of the Revolution."
      - "It is celebrated with a military parade in Paris and fireworks across the country."
    words: [la fête nationale, le défilé, le feu d'artifice, la Révolution]
    status: draft
  - id: fr.b2.topic-verlan
    level: B2
    strand: topic
    title: "Verlan"
    notes: "Slang, young people's speech, or colloquial French."
    facts:
      - "Verlan is slang that swaps the syllables of words; the name itself is l'envers ('the reverse') reversed."
      - "Common examples: meuf (femme), relou (lourd, annoying), chelou (louche, shady)."
      - "Some verlan words, like meuf, are now ordinary informal French."
    words: [le verlan, la meuf, relou, chelou]
    status: draft
