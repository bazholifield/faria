    status: draft
  - id: es.b2.topic-quijote
    level: B2
    strand: topic
    title: "Don Quijote"
    notes: "Books, reading, or when someone 'tilts at windmills'."
    facts:
      - "Miguel de Cervantes published the first part of Don Quijote in 1605 and the second in 1615."
      - "It is often called the first modern novel."
      - "Spanish is sometimes called 'la lengua de Cervantes'."
    words: [el caballero, el molino, la novela, luchar contra molinos de viento]
    status: draft
  - id: es.b2.topic-frida-kahlo
    level: B2
    strand: topic
    title: "Frida Kahlo"
    notes: "Art, Mexico City, or overcoming hardship."
    facts:
      - "Frida Kahlo (1907-1954) was a Mexican painter known above all for her self-portraits."
      - "She lived in the Casa Azul in Coyoacán, Mexico City, which is now a museum."
      - "She was married to the muralist Diego Rivera."
    words: [el autorretrato, el muralista, pintar, la exposición]
    status: draft
